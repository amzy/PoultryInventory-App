name: Android APK Release

on:
  push:
    branches:
      - main
    paths:
      - 'poultry-inventory.apk'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public App repository
        uses: actions/checkout@v4

      - name: Verify committed APK
        run: |
          test -s poultry-inventory.apk
          file poultry-inventory.apk || true
          ls -lh poultry-inventory.apk

      - name: Read source version
        id: version
        shell: bash
        run: |
          VERSION_LINE=$(grep '^version:' source-version.txt 2>/dev/null | head -n 1 | sed 's/^version:[[:space:]]*//' || true)
          if [ -z "$VERSION_LINE" ]; then VERSION_LINE="1.0.1+0"; fi
          VERSION_NAME="${VERSION_LINE%%+*}"
          BUILD_NUMBER="${VERSION_LINE#*+}"
          if [ "$BUILD_NUMBER" = "$VERSION_LINE" ]; then BUILD_NUMBER=0; fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Poultry Inventory ${{ steps.version.outputs.version_name }} (Build ${{ github.run_number }})
          body: |
            Automated Android APK release.

            Version: ${{ steps.version.outputs.version_name }}
            Build number: ${{ steps.version.outputs.build_number }}
            Public App commit: ${{ github.sha }}
          files: poultry-inventory.apk
          generate_release_notes: false
          prerelease: true
