name: Repair Categories Desktop Rendering
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-category-render.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Restore and patch settings screen
        shell: bash
        run: |
          git checkout HEAD^ -- lib/screens/settings_screen.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path("lib/screens/settings_screen.dart")
          text = path.read_text()
          old = "Expanded(child: SingleChildScrollView(child: body))"
          new = "Expanded(child: selected == 4 ? body : SingleChildScrollView(child: body))"
          if old not in text:
              raise SystemExit("Expected settings layout line was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/repair-category-render.yml
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "OvalOasis Repair"
          git config user.email "actions@users.noreply.github.com"
          git add lib/screens/settings_screen.dart .github/workflows/repair-category-render.yml
          git commit -m "Fix categories panel rendering on desktop"
          git push origin main
