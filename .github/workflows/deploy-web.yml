name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - '.deploy/source-trigger'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Build and Deploy Flutter Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout public App repository
        uses: actions/checkout@v4

      - name: Checkout private source repository
        uses: actions/checkout@v4
        with:
          repository: amzy/PoultryInventory
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: source
          ref: main

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: source
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: source
        run: flutter build web --release --base-href /

      - name: Prepare Pages artifact
        working-directory: source
        run: |
          cp build/web/index.html build/web/404.html
          printf 'app.ovaloasis.in\n' > build/web/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
